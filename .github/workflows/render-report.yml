name: Har Soatda Hisobotni Yangilash

on:
  schedule:
    # Har soatning boshida (masalan, 13:00, 14:00) avtomatik ishga tushadi
    - cron: '0 * * * *'
  
  # "Actions" bo'limida "Run workflow" tugmasini yaratadi (qo'lda ishga tushirish uchun)
  workflow_dispatch:

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    permissions:
      # Repozitoriyga o'zgarishlarni yozish (push qilish) uchun ruxsat beradi
      contents: write
    steps:
      # 1-qadam: Repozitoriy kodini virtual mashinaga yuklab oladi
      - name: Repozitoriy kodini olish
        uses: actions/checkout@v4
        with:
          # `git pull` ishlashi uchun to'liq tarixni olish muhim
          fetch-depth: 0

      # 2-qadam: Serverdagi so'nggi versiyani darhol olish
      # Bu "non-fast-forward" va "unstaged changes" xatolarining oldini oladi
      - name: Eng so'nggi o'zgarishlarni tortib olish (rebase bilan)
        run: git pull origin main --rebase

      # 3-qadam: R muhitini o'rnatish
      - name: R muhitini o'rnatish
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'

      # 4-qadam: Quarto muhitini o'rnatish
      - name: Quarto muhitini o'rnatish
        uses: quarto-dev/quarto-actions/setup@v2

      # 5-qadam: R paketlari uchun keshni sozlash (ish jarayonini tezlashtirish uchun)
      - name: R paketlari keshini tiklash
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-r-${{ hashFiles('**/lockfile') }}
          restore-keys: |
            ${{ runner.os }}-r-

      # 6-qadam: Kerakli R paketlarini o'rnatish
      - name: R paketlarini o'rnatish
        run: Rscript -e "install.packages(c('httr', 'jsonlite', 'quarto', 'tidyverse', 'readxl', 'gt'))"

      # 7-qadam: Hisobotni yaratuvchi R skriptini ishga tushirish
      - name: Hisobotni render qilish (update_report.R)
        run: Rscript update_report.R
        env:
          # GitHub Secrets'dagi KOBO_TOKEN'ni R skriptiga o'zgaruvchi sifatida uzatadi
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}

      # 8-qadam: Yangilangan fayllarni avtomatik commit qilish va push qilish
      - name: O'zgarishlarni commit qilish
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Hisobot avtomatik yangilandi"
          # Qaysi fayllar yoki papkalar o'zgarganini aniqlab, faqat shularni commit qiladi
          file_pattern: report.html kobo_data.rds report_files/
